name: Bug report
description: Something in Udon Test Kit doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >-
        What you did, what you expected, and what happened instead, with the test failure message
        or any error from the Unity log. A minimal failing test helps most. Say whether it ran from
        the Test Runner window or the command line.
    validations:
      required: true
  - type: input
    id: kit-version
    attributes:
      label: Udon Test Kit version
      description: Shown in the Creator Companion, or in package.json of the kit.
  - type: input
    id: sdk-version
    attributes:
      label: VRChat Worlds SDK version
      description: The kit relies on SDK internals, so this matters most.
