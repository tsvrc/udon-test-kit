name: Feature request
description: Something Udon Test Kit doesn't do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to test?
      description: What part of your world is hard or impossible to test with the kit today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Ideas
      description: How the test code could look, or what you do today instead.
